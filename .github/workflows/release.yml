# Follow upstream OpenRGB, apply this fork's patches, build the Linux AppImage in
# upstream's own CI container, and publish a release when upstream or the
# patches changed. Failures open (or update) an issue instead of releasing.
name: Sync upstream and release

on:
  schedule:
    - cron: "17 4 * * *"          # daily, 04:17 UTC
  push:
    branches: [main]
    paths: ["patches/**", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Build and release even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://gitlab.com/CalcProgrammer1/OpenRGB.git
  UPSTREAM_BRANCH: master
  NAME: OpenRGB-8BitDo-Retro87

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      upstream: ${{ steps.version.outputs.upstream }}
      upstream_date: ${{ steps.version.outputs.upstream_date }}
      patches: ${{ steps.version.outputs.patches }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Clone upstream OpenRGB
        run: git clone --branch "$UPSTREAM_BRANCH" "$UPSTREAM_URL" openrgb

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          upstream=$(git -C openrgb rev-parse --short=10 HEAD)
          patches=$(cat patches/*.patch | sha256sum | cut -c1-10)
          tag="u${upstream}-p${patches}"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "upstream_date=$(git -C openrgb log -1 --format=%cs)" >> "$GITHUB_OUTPUT"
          echo "patches=$patches" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "Release $tag exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the patches
        if: steps.version.outputs.build == 'true'
        working-directory: openrgb
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f upstream HEAD
          git checkout -b retro87
          for patch in ../patches/*.patch; do
            echo "::group::$patch"
            git apply --index --verbose "$patch"
            echo "::endgroup::"
          done
          git commit -q -m "Apply the ${NAME} patches (${{ steps.version.outputs.patches }})" \
                        -m "Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # Browsable source branches. GitHub refuses pushes by the workflow token
      # that add or change workflow files, which happens if upstream edits its
      # .github/workflows; then only these branches lag, the release still builds.
      - name: Update the upstream and retro87 branches
        if: steps.version.outputs.build == 'true'
        continue-on-error: true
        working-directory: openrgb
        env:
          TOKEN: ${{ github.token }}
        run: |
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            upstream:refs/heads/upstream retro87:refs/heads/retro87

      - name: Package the patched source
        if: steps.version.outputs.build == 'true'
        run: tar -czf source.tar.gz openrgb

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.build == 'true'
        with:
          name: source
          path: source.tar.gz
          retention-days: 3

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:trixie-amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source

      - name: Build the AppImage (upstream's script)
        run: |
          tar -xzf source.tar.gz
          git config --global --add safe.directory '*'
          cd openrgb
          export $(dpkg-architecture)
          ./scripts/build-appimage.sh qt6
          mv OpenRGB-*.AppImage "../${NAME}-x86_64.AppImage"
          cd ..
          sha256sum "${NAME}-x86_64.AppImage" > "${NAME}-x86_64.AppImage.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: ${{ env.NAME }}-x86_64.AppImage*
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: appimage

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          UPSTREAM_DATE: ${{ needs.prepare.outputs.upstream_date }}
          PATCHES: ${{ needs.prepare.outputs.patches }}
        run: |
          cat > notes.md <<EOF
          Unofficial OpenRGB build with the 8BitDo Retro 87 patches from this repository.

          - Upstream: [\`${UPSTREAM}\`](https://gitlab.com/CalcProgrammer1/OpenRGB/-/commit/${UPSTREAM}) (${UPSTREAM_DATE}), branch \`${UPSTREAM_BRANCH}\`
          - Patches: \`${PATCHES}\` ([patches/](https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/patches))
          - Source: branch [\`retro87\`](https://github.com/${GITHUB_REPOSITORY}/tree/retro87)
          - Built by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) in upstream's CI container, Qt 6, x86_64

          Download \`${NAME}-x86_64.AppImage\`, check it against the \`.sha256\` file, make it executable and run it.
          Linux needs udev access to the keyboard; see the README.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${NAME}-x86_64.AppImage" "${NAME}-x86_64.AppImage.sha256" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${NAME}-x86_64.AppImage" "${NAME}-x86_64.AppImage.sha256" \
              --target "$GITHUB_SHA" --latest \
              --title "OpenRGB + 8BitDo Retro 87 (upstream ${UPSTREAM:0:7}, ${UPSTREAM_DATE})" \
              --notes-file notes.md
          fi

      - name: Close resolved failure issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in $(gh issue list --label auto-update --state open --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$issue" --comment "Resolved: released ${{ needs.prepare.outputs.tag }}."
          done

  report-failure:
    needs: [prepare, build, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          gh label create auto-update --color d73a4a --description "Automatic upstream sync failed" --force
          body="The automatic update failed (upstream \`${UPSTREAM:-unknown}\`): ${RUN}

          Usually the patches no longer apply to upstream, or upstream changed the build. Update \`patches/\` and push to \`main\`; the workflow reruns and closes this issue on success."
          existing=$(gh issue list --label auto-update --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Automatic upstream update failed" --label auto-update --body "$body"
          fi
